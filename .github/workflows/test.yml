name: test
on: [push, pull_request, workflow_dispatch]

jobs:
  guards:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # odl must stay at 0.8.1 - 1.0 is an API rewrite that moves odl.tomo
      - run: pip install numpy scipy "odl==0.8.1"

      # Every guard is run against a deliberately broken input and must fail
      # for the right reason. The GPU half needs the LoDoPaB files and skips
      # itself here; the CPU half is what has to hold everywhere.
      - name: guards fail on deliberately broken operators
        run: python tests/test_mismatch_guards.py

      # The documentation quotes ~95 numbers that live in results/*.json, and this
      # re-derives every one of them. Two kinds of failure, because they are
      # different: a number that disagrees with the data, and a *bound* quoted
      # tighter than the data it bounds -- 0.003 px copied from the classical
      # experiment into the learned-side paragraph (measured 0.0059), and 0.006 dB
      # against a measured 0.0064, both of which read as fine until re-derived.
      # It first proves it can fail, corrupting a table cell, a file label, a
      # bound and a p-value in memory and requiring each to raise a failure of its
      # own, so a check that has quietly stopped checking cannot pass by riding on
      # an unrelated one.
      - name: the documentation still matches the data
        run: python guards/readme_bounds.py --self-test

      # This workflow names the patterns it hunts, so it excludes itself -
      # the same self-match that made the first version of this check fail.
      - name: no local paths or private identifiers anywhere in the tree
        run: |
          if grep -rIn -e '/public/home' -e '/public/share' -e 'chengguo' \
               --include='*.py' --include='*.md' --include='*.yml' \
               --exclude-dir='.github' . ; then
            echo "::error::a local path or private identifier reached the repository"
            exit 1
          fi
